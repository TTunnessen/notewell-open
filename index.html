<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Notewell</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #020617; color: #e2e8f0; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #94a3b8; margin: 0 0 16px; }
  a.button { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #0369a1;
             color: #fff; font-weight: 600; text-decoration: none; }
  .error { color: #fca5a5; }
</style>
</head>
<body>
<main>
  <h1>Opening Notewell…</h1>
  <p id="msg">If nothing happens, tap the button. Notewell needs to be installed on this device.</p>
  <a id="open" class="button" href="#">Open in Notewell</a>
</main>
<script>
  // Google Docs only allows http(s) links, so a Doc links here and this page
  // hands off to the app's own notewell:// link. It stores and sends nothing.
  (function () {
    var id = new URLSearchParams(location.search).get("note") || "";
    var btn = document.getElementById("open");
    if (!/^note_[A-Za-z0-9_]{1,80}$/.test(id)) {
      document.getElementById("msg").textContent = "This link doesn't point to a Notewell note.";
      document.getElementById("msg").className = "error";
      btn.style.display = "none";
      return;
    }
    var target = "notewell://note/" + encodeURIComponent(id);
    btn.href = target;
    location.href = target;
  })();
</script>
</body>
</html>
